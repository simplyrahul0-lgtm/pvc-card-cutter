<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVC Card Auto Resizer & Cutter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; color: #333; }
    select, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; background: #f9f9f9; margin-bottom: 10px; }
    .status { margin: 10px 0; font-weight: bold; color: #007bff; font-size: 14px; }
    .preview-section { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; align-items: center; }
    
    .card-box {
      width: 323px;
      height: 204px;
      border: 1px solid #000;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    canvas { width: 100%; height: 100%; }
    .btn-print { margin-top: 20px; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-print:disabled { background-color: #ccc; }

    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; display: flex; flex-wrap: wrap; gap: 10px; }
      .card-box {
        width: 85.6mm !important;
        height: 53.98mm !important;
        border: 0.5px solid #000 !important;
        border-radius: 3mm !important;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>অল-টাইপ PVC কার্ড প্রস্তুতকারক</h2>
    
    <div class="input-group">
      <label>১. কার্ডের ধরন নির্বাচন করুন:</label>
      <select id="cardType">
        <option value="voter">ভোটার কার্ড (e-EPIC PDF)</option>
        <option value="aadhaar">আধার কার্ড (e-Aadhaar PDF)</option>
        <option value="pan">প্যান কার্ড (e-PAN PDF)</option>
      </select>

      <label>২. পিডিএফ ফাইল নির্বাচন করুন:</label>
      <input type="file" id="pdfInput" accept="application/pdf">
    </div>

    <div class="status" id="statusText">পছন্দের কার্ড ও PDF সিলেক্ট করুন</div>

    <div class="preview-section print-area" id="printArea">
      <div>
        <p style="font-size: 12px; color: #555; margin-bottom: 3px;">Front Side (সামনের অংশ)</p>
        <div class="card-box"><canvas id="frontCanvas"></canvas></div>
      </div>
      <div>
        <p style="font-size: 12px; color: #555; margin-bottom: 3px;">Back Side (পেছনের অংশ)</p>
        <div class="card-box"><canvas id="backCanvas"></canvas></div>
      </div>
    </div>

    <button class="btn-print" id="printBtn" onclick="window.print()" disabled>প্রিন্ট / PDF ডাউনলোড</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById('pdfInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      const cardType = document.getElementById('cardType').value;
      const status = document.getElementById('statusText');
      const printBtn = document.getElementById('printBtn');
      
      if (!file) return;

      status.innerText = "প্রসেস করা হচ্ছে...";
      printBtn.disabled = true;

      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        
        try {
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({ scale: 3.0 });
          
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = viewport.width;
          tempCanvas.height = viewport.height;

          await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;

          if (cardType === 'voter') {
            // Updated coordinates specifically for Voter ID PDF layout
            cropCard(tempCanvas, 'frontCanvas', 0.015, 0.165, 0.67, 0.355);
            cropCard(tempCanvas, 'backCanvas', 0.370, 0.165, 0.67, 0.355);
          } else if (cardType === 'aadhaar') {
            cropCard(tempCanvas, 'frontCanvas', 0.62, 0.10, 0.80, 0.32);
            cropCard(tempCanvas, 'backCanvas', 0.62, 0.50, 0.80, 0.32);
          } else if (cardType === 'pan') {
            cropCard(tempCanvas, 'frontCanvas', 0.68, 0.08, 0.84, 0.28);
            cropCard(tempCanvas, 'backCanvas', 0.68, 0.50, 0.84, 0.28);
          }

          status.innerText = "কার্ড সঠিক সাইজে তৈরি হয়েছে!";
          status.style.color = "green";
          printBtn.disabled = false;
        } catch (error) {
          console.error(error);
          status.innerText = "PDF ফাইলটি পড়া যায়নি! সঠিক ফাইলের ধরন সিলেক্ট করুন।";
          status.style.color = "red";
        }
      };

      fileReader.readAsArrayBuffer(file);
    });

    function cropCard(sourceCanvas, targetCanvasId, startYRatio, startXRatio, widthRatio, heightRatio) {
      const targetCanvas = document.getElementById(targetCanvasId);
      const ctx = targetCanvas.getContext('2d');

      targetCanvas.width = 1012;
      targetCanvas.height = 638;

      const srcX = sourceCanvas.width * startXRatio;
      const srcY = sourceCanvas.height * startYRatio;
      const srcWidth = sourceCanvas.width * widthRatio; 
      const srcHeight = sourceCanvas.height * heightRatio;

      ctx.drawImage(
        sourceCanvas,
        srcX, srcY, srcWidth, srcHeight,
        0, 0, targetCanvas.width, targetCanvas.height
      );
    }
  </script>

</body>
</html>
