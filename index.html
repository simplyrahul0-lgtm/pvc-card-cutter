<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVC Card Cutter & Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; color: #333; }
    input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; background: #f9f9f9; }
    .preview-section { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; align-items: center; }
    .card-box { width: 323px; height: 204px; border: 2px dashed #007bff; border-radius: 10px; overflow: hidden; position: relative; background: #fafafa; display: flex; justify-content: center; align-items: center; }
    .card-box img { width: 100%; height: 100%; object-fit: fill; display: none; }
    .placeholder-text { color: #888; font-size: 13px; }
    .btn-print { margin-top: 20px; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-print:active { background-color: #218838; }

    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; display: flex; flex-wrap: wrap; gap: 10px; }
      .card-box { width: 85.6mm !important; height: 53.98mm !important; border: 1px solid #000 !important; border-radius: 3mm !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>অল-টাইপ PVC কার্ড প্রস্তুতকারক</h2>
    
    <div class="input-group">
      <label>সামনের অংশ (Front Side):</label>
      <input type="file" id="frontInput" accept="image/*">
    </div>

    <div class="input-group">
      <label>পেছনের অংশ (Back Side):</label>
      <input type="file" id="backInput" accept="image/*">
    </div>

    <div class="preview-section print-area">
      <div class="card-box">
        <span class="placeholder-text" id="frontTxt">Front Side Preview</span>
        <img id="frontPreview" alt="Front Side">
      </div>

      <div class="card-box">
        <span class="placeholder-text" id="backTxt">Back Side Preview</span>
        <img id="backPreview" alt="Back Side">
      </div>
    </div>

    <button class="btn-print" onclick="window.print()">প্রিন্ট / PDF ডাউনলোড</button>
  </div>

  <script>
    function setupImagePreview(inputId, imgId, txtId) {
      document.getElementById(inputId).addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            const img = document.getElementById(imgId);
            img.src = event.target.result;
            img.style.display = 'block';
            document.getElementById(txtId).style.display = 'none';
          };
          reader.readAsDataURL(file);
        }
      });
    }

    setupImagePreview('frontInput', 'frontPreview', 'frontTxt');
    setupImagePreview('backInput', 'backPreview', 'backTxt');
  </script>

</body>
</html>
